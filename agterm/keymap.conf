# agterm keymap — a kitty-flavored config for rebinding built-in shortcuts and defining
# custom shell commands. Edit this file and run File ▸ Reload Keymap (or `agtermctl keymap
# reload`) to apply. Blank lines and lines starting with `#` are ignored.
#
# Two verbs:
#
#   map <chord> <action>
#       Rebind a built-in action to a single chord (no leader sequences for built-ins).
#       Chords use kitty syntax: mods joined by `+`, e.g. `cmd+shift+d`, `ctrl+\``.
#       Mods: ctrl, cmd, opt, shift. Example:
#
#           map cmd+shift+d  toggle_split
#
#   command "<name>" [chord] <shell...>
#       Define a custom command, shown in the action palette marked `custom`. The quoted
#       name may contain spaces. An optional chord (single chord OR a leader like `ctrl+a>g`)
#       binds it to a key; the chord MUST include a modifier (a bare key is rejected and the
#       line becomes palette-only). Omit the chord for a palette-only command. The rest of the
#       line is run via `/bin/sh -c`, detached with no terminal — so it suits fire-and-forget
#       launches (GUI apps, scripts), NOT a bare interactive or full-screen TUI program, which
#       has no TTY and exits at once. Launch a TUI over a session through an overlay terminal,
#       as the Lazygit example does. Examples:
#
#           command "Open in Zed"  cmd+shift+e  open -a Zed "$AGT_SESSION_PWD"
#           command "Lazygit"      ctrl+a>g     agtermctl session overlay open lazygit --socket "$AGT_SOCKET"
#           command "Deploy"                    ./deploy.sh
#
# Built-in actions (raw name → shipped default chord). This list drifts between
# releases -- reprint the live one with `agtermctl keymap list`, which also marks
# with * any action this file has rebound. Verified against agterm 0.24.0:
#
#   new_window                  cmd+opt+n
#   rename_window               (no default)
#   delete_window               (no default)
#   new_workspace               cmd+shift+n
#   rename_workspace            (no default)
#   delete_workspace            (no default)
#   new_session                 cmd+n
#   open_directory              cmd+o
#   rename_session              (no default)
#   duplicate_session           (no default)
#   close_session               cmd+w
#   reopen_recent               cmd+shift+t
#   undo_close                  cmd+z
#   clear_status                (no default)
#   increase_font_size          cmd++
#   decrease_font_size          cmd+-
#   reset_font_size             cmd+0
#   toggle_split                cmd+d          (left/right)
#   toggle_horizontal_split     cmd+shift+d    (top/bottom; 0.23.0+)
#   toggle_scratch              cmd+j
#   toggle_terminal_zoom        cmd+shift+return
#   toggle_search               cmd+f
#   toggle_sidebar              ctrl+cmd+s
#   select_theme                (no default)
#   toggle_fullscreen           ctrl+cmd+f
#   toggle_flagged_view         (no default)
#   toggle_flag                 cmd+shift+f
#   focus_workspace             (no default)
#   toggle_workspace_filter     (no default)
#   previous_workspace          (no default)
#   next_workspace              (no default)
#   toggle_workspace_collapse   (no default)
#   focus_left_pane             cmd+opt+left
#   focus_right_pane            cmd+opt+right
#   previous_session            cmd+opt+up
#   next_session                cmd+opt+down
#   previous_attention_session  ctrl+opt+up
#   next_attention_session      ctrl+opt+down
#   first_session               (no default)
#   last_session                (no default)
#   quick_terminal              ctrl+`         (rebound below to ctrl+opt+`)
#   session_palette             ctrl+p
#   command_palette             ctrl+shift+p
#   custom_command_palette      ctrl+shift+o
#   show_attention              ctrl+shift+i
#   dashboard                   cmd+shift+g
#
# Custom-command tokens (expanded in the shell line and exported as $AGT_X env vars):
#
#   {AGT_SESSION_ID}
#   {AGT_SESSION_NAME}
#   {AGT_SESSION_PWD}
#   {AGT_WORKSPACE_ID}
#   {AGT_WORKSPACE_NAME}
#   {AGT_WINDOW_ID}
#   {AGT_WINDOW_NAME}
#   {AGT_SELECTION}
#   {AGT_SOCKET}
#
# NOTE: a {AGT_X} token is substituted RAW into the /bin/sh line — convenient, but unsafe for
# content you don't control. {AGT_SELECTION} is the obvious case, but a remote host can also set
# the session title (OSC) and the working directory (OSC 7), so {AGT_SESSION_NAME} and
# {AGT_SESSION_PWD} are equally unsafe raw. For any such content prefer the matching $AGT_X
# environment variable, QUOTED, e.g. "$AGT_SELECTION".
#
# Uncomment and edit a line below to start.
# map cmd+shift+d toggle_split

# New tab inherits the focused tab's cwd, inserted right after it, instead of
# opening at $HOME (the agterm equivalent of ghostty's
# tab-inherit-working-directory = true).
# NOT `map cmd+n duplicate_session` -- that action name is not valid in this
# build (it produces a keymap parse diagnostic). The CLI command does exist,
# and it resolves the cwd server-side from --target (default: active), so it
# does not depend on $AGT_SESSION_PWD at all.
# On cmd+t (the conventional macOS new-tab key); cmd+n is left unmapped so it
# keeps its shipped new_session default, which opens at $HOME.
command "New Tab Here" cmd+t /opt/homebrew/bin/agtermctl session duplicate --socket "$AGT_SOCKET"

# Bracket idiom: cmd for panes, cmd+shift for sessions.
#
# These are `command` lines rather than `map` lines ON PURPOSE. A `map` REBINDS
# a built-in and so can move it off its shipped chord; a `command` defines a new
# custom action and leaves every built-in alone. That keeps the native bindings
# fully intact alongside these additions:
#   ctrl+tab      MRU session switcher   (reserved)
#   ctrl+1/ctrl+2 focus left/right pane  (reserved)
#   opt+cmd+up/down    previous/next session
#   ctrl+opt+up/down   previous/next attention session
#   ctrl+p  session palette    cmd+shift+g  dashboard
#   cmd+d   split left/right   cmd+shift+d  split top/bottom
#
# Pane focus is absolute (left/right), not a rotating cycle, and is a no-op
# unless the session has a split. Chords name the UNSHIFTED base key, so
# cmd+shift+[ is the physical [ key with shift, not a binding on {.
# Both keys cycle: `focus other` alternates panes, and since agterm's split is
# a fixed pair, alternating IS cycling -- so direction is meaningless and the
# two chords are deliberately identical.
# NO split-creating fallback: with only one pane `session focus` exits 1 with
# "session has no split" and, because custom commands run detached with no TTY,
# that error is discarded and the key is a silent no-op. Create splits with
# cmd+d.
command "Cycle Pane Forward" cmd+] /opt/homebrew/bin/agtermctl session focus other --socket "$AGT_SOCKET"
command "Cycle Pane Back"    cmd+[ /opt/homebrew/bin/agtermctl session focus other --socket "$AGT_SOCKET"
command "Previous Session" cmd+shift+[ /opt/homebrew/bin/agtermctl session go --to prev --socket "$AGT_SOCKET"
command "Next Session"     cmd+shift+] /opt/homebrew/bin/agtermctl session go --to next --socket "$AGT_SOCKET"

# Quick terminal that reuses the focused tab's cwd. The quick terminal is
# per-window, not in the session tree, and has no --cwd -- so we cd it on show.
# Toggle-aware: hides when already visible, else shows and cds.
# Notes: agtermctl needs its ABSOLUTE path (custom commands get the app's GUI
# PATH, so a bare `agtermctl` exits 127), and $AGT_SESSION_PWD is single-quoted
# when typed because OSC 7 makes it untrusted input to the quick shell.
# Move the stock toggle aside so this owns ctrl+` outright.
map ctrl+opt+` quick_terminal
command "Quick Terminal Here" ctrl+` AGT=/opt/homebrew/bin/agtermctl; if "$AGT" tree --json --socket "$AGT_SOCKET" | grep -q '"quickVisible":true'; then "$AGT" quick hide --socket "$AGT_SOCKET"; else "$AGT" quick show --socket "$AGT_SOCKET" && printf "cd '%s' && clear\n" "$AGT_SESSION_PWD" | "$AGT" quick type --stdin --socket "$AGT_SOCKET"; fi

# ---------------------------------------------------------------------------
# VSCode-style terminal panel: a 30%-tall shell BELOW the session (cmd+`),
# the agterm equivalent of ghostty's `keybind = cmd+grave_accent=new_split:down`
# plus `resize_split:down,500` (both quarantined as inert in ghostty.conf).
#
# REQUIRES agterm >= 0.23.0 -- `--axis` landed in PR #427 (Discussion #268),
# which also split `session split` into `visibility` (default) and `close`.
# Below that it exits 64 on the unknown flag and, because custom commands run
# detached with no TTY, that error is discarded and the key is a silent no-op.
#
# Why `split toggle` and not two commands: the built-in action handles all four
# states in one call -- creates the split if there is none, reveals it if hidden,
# hides it (shell kept alive, like ghostty's panel) if shown, and TRANSPOSES it
# if a vertical cmd+d split is currently up. So cmd+d and cmd+` stay coherent
# instead of fighting over the same pane pair.
#
# --split-ratio is the PRIMARY pane's fraction, and primary means TOP on the
# horizontal axis -- so 0.7 leaves the bottom pane at 30%. It runs on every
# press, which re-asserts 70/30 and therefore overrides a divider you dragged
# by hand; drop the second half of the line to let agterm remember your drag
# instead (it persists splitRatio per session either way).
#
# `session split on` moves focus INTO the new pane, which is the panel behavior
# wanted here. cmd+[ / cmd+] below still cycle back to the top pane.
#
# CAVEAT: cmd+` is the macOS "cycle windows in this app" chord. agterm wins it
# while frontmost, so multi-window cycling inside agterm goes away (cmd+opt+n
# still makes windows, and the Window menu still switches them).
command "Terminal Panel" cmd+` AGT=/opt/homebrew/bin/agtermctl; "$AGT" session split toggle --axis horizontal --socket "$AGT_SOCKET" && "$AGT" session resize --split-ratio 0.7 --socket "$AGT_SOCKET"

# There is also a plain built-in for the same axis, with no ratio control:
#   map cmd+` toggle_horizontal_split        # shipped default is cmd+shift+d
# It is left on its default so cmd+shift+d gives a 50/50 top/bottom split and
# cmd+` gives the 70/30 panel -- two intents, two keys, neither shadowing the
# other. 0.23.0 moved dashboard off cmd+shift+d to cmd+shift+g to free it.
