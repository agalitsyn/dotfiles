# agterm-scoped ghostty config — applies ONLY to agterm, not the standalone Ghostty.app.
# Put any ghostty config key here to override agterm's bundled defaults and your global
# ~/.config/ghostty/config. Full key reference: https://ghostty.org/docs/config
#
# Edit this file and run File ▸ Reload Config (or relaunch) to apply. Blank lines and lines
# starting with `#` are ignored. Most keys apply to open terminals on reload, but layout keys
# (window-padding-*) and shell-spawn keys (term, shell-integration-features) only take effect in
# a new session/window or after a relaunch.
#
# Example — make the macOS Option key send Alt (uncomment to enable):
# macos-option-as-alt = true
#
# NOTE: agterm's UI-managed keys (font, theme, background opacity/blur, scroll speed) are set
# in Settings and always win over this file — set those in Settings, everything else here.

# Font, matching ~/.dotfiles/ghostty/config so agterm renders the same as Ghostty.app.
# Set here rather than in Settings so it survives turning off "Use my global Ghostty config"
# (which is what currently supplies it). CAVEAT: font IS a Settings-managed key, so if you
# ever change the font in Settings ▸ Appearance these two lines stop having any effect --
# Settings is written to ghostty-settings.conf, which loads last and wins.
font-family = "IosevkaTerm NFM"
font-size = 17

# ---------------------------------------------------------------------------
# Copied from ~/.dotfiles/ghostty/config so agterm is self-contained and
# Settings > General > "Use my global Ghostty config" can be turned OFF.
# ---------------------------------------------------------------------------

shell-integration-features = no-cursor
cursor-style = block
cursor-style-blink = false
mouse-hide-while-typing = true

confirm-close-surface = false
clipboard-paste-protection = false
copy-on-select = true

scrollback-limit = 4294967295
keybind = shift+enter=text:\n

macos-option-as-alt = true

notify-on-command-finish = unfocused
notify-on-command-finish-action = no-bell,notify
notify-on-command-finish-after = 30s

# --- Deliberately NOT copied: inert in agterm ------------------------------
#
# theme = light:Apple System Colors Light,dark:vesper
#   Theme is a Settings-managed key and always wins over this file (Settings is
#   currently on Vesper). To reproduce the light/dark tracking, run:
#     agtermctl theme set "Apple System Colors Light" --dark vesper
#
# keybind = cmd+grave_accent=new_split:down
# keybind = chain=resize_split:down,500
#   agterm owns its own pane model, so ghostty's new_split / resize_split have
#   nothing to dispatch to. As of agterm 0.23.0 the split does have an axis
#   (cmd+d left/right, cmd+shift+d top/bottom, and either one transposes a live
#   split), but it is still a single pair, not a tree. The equivalent lives in
#   keymap.conf: cmd+d toggles the split, cmd+` opens it as a 30% bottom panel.
#
# unfocused-split-opacity = 0.7
# unfocused-split-fill = #333333
#   Same reason -- these belong to ghostty's split model, which agterm never
#   dispatches to, so they were inert here. agterm draws its own wash over the
#   unfocused pane of a shown split (paneDim), shared with the backdrop behind a
#   floating overlay and the quick terminal. Strength is a Settings knob, not a
#   config key: Settings (cmd+,) > Appearance > "Inactive pane and backdrop
#   mute", 0-10, default 5. It maps 0 -> no wash, 5 -> 0.4, 10 -> 0.8, and
#   persists to settings.json as `inactivePaneMuteStrength` (absent = default).
#   The wash fades text toward the terminal color rather than filling with a
#   color of its own, so unfocused-split-fill has no equivalent at all.
#
# window-inherit-working-directory = false
# tab-inherit-working-directory = true
# split-inherit-working-directory = true
#   agterm creates windows/sessions/splits itself, so these never fire -- which
#   is exactly why cmd+t in keymap.conf shells out to `agtermctl session
#   duplicate` to get cwd-inheriting new tabs.
